<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHIDVI-556 laptop controller</title>
  <link rel="stylesheet" href="/static/controller.css">
  <script src="/static/controller.js" defer></script>
</head>
<body>
  <div class="controller">
    <header>
      <div><strong class="brand">CHIDVI-556</strong><p>Laptop controller</p></div>
      <span id="connection" class="connection" role="status">Connecting</span>
    </header>
    <section class="laptop" aria-label="Laptop status">
      <span id="personality">Personality loading</span>
      <span id="control">Checking laptop</span>
      <button id="disconnect" class="quiet">Disconnect phone</button>
    </section>
    <div id="notice" class="notice" role="alert" hidden></div>
    <main id="feed" role="log" aria-label="Conversation" aria-live="polite">
      <p class="empty">What would you like to do on your laptop? Commands use the same CHIDVI agent and permissions as the desktop.</p>
    </main>
    <section class="task-panel" aria-label="Task progress">
      <div class="task-heading"><strong>Task progress</strong><button id="stop" class="stop" disabled>Stop task</button></div>
      <ol id="tasks"><li class="muted">No tasks yet.</li></ol>
    </section>
    <form id="composer">
      <label for="command">Message your laptop</label>
      <textarea id="command" rows="2" maxlength="4000" placeholder="Tell CHIDVI what you need" required></textarea>
      <div class="actions">
        <label class="button quiet" for="file">Attach file<input id="file" type="file" hidden></label>
        <button id="mic" type="button" class="quiet" aria-pressed="false">Microphone</button>
        <button id="send" type="submit" disabled>Send</button>
      </div>
      <p id="mic-state" class="hint">Microphone is off. Text commands are always available.</p>
    </form>
  </div>
</body>
</html>
