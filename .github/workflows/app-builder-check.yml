name: CHIDVI-556 App Builder Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  app-builder-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install builder test dependency
        run: python -m pip install "google-genai>=2.8.0"

      - name: Compile Python sources
        run: python -m compileall -q actions core voice_auth tests main.py ui.py

      - name: Run builder utility tests
        run: python -m unittest tests.test_app_builder tests.test_voice_auth
